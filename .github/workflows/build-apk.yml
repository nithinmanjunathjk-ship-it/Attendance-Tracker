name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Analyze, test & build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Generate Gradle wrapper
        run: |
          FLUTTER_SDK_PATH="$(dirname "$(dirname "$(command -v flutter)")")"
          ANDROID_SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          {
            echo "flutter.sdk=$FLUTTER_SDK_PATH"
            echo "sdk.dir=$ANDROID_SDK_PATH"
          } > android/local.properties

          # Generate the wrapper in an isolated empty directory so the
          # ambient system Gradle never has to evaluate this project's
          # settings.gradle (which pulls in Flutter's own Gradle plugin
          # and can be incompatible with newer system Gradle versions).
          rm -rf /tmp/gradle-wrapper-gen
          mkdir -p /tmp/gradle-wrapper-gen
          touch /tmp/gradle-wrapper-gen/settings.gradle
          (cd /tmp/gradle-wrapper-gen && gradle wrapper --gradle-version 8.6 --distribution-type all)

          cp -r /tmp/gradle-wrapper-gen/gradle android/gradle
          cp /tmp/gradle-wrapper-gen/gradlew android/gradlew
          cp /tmp/gradle-wrapper-gen/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew

      - name: Create .env from repository secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        # Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets under
        # Settings → Secrets and variables → Actions before running this
        # workflow, otherwise the app will build with an empty .env file
        # and fail to connect to Supabase at runtime.

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
